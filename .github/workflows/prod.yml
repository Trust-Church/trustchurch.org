name: Build & Push Docker Image

on:
  push:
    branches:
      - test
      - qa
      - main

  workflow_dispatch:

jobs:
  docker:
    name: Build & Push (${{ github.ref_name }})
    runs-on: ubuntu-latest

    environment: DOCKERHUB

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_UN }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate Docker tags
        id: tags
        shell: bash
        run: |
          BRANCH_TAG=$(echo "${GITHUB_REF_NAME}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's#[^a-z0-9_.-]#-#g')

          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)

          echo "branch=${BRANCH_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_REPO }}
          tags: |
            type=raw,value=${{ steps.tags.outputs.branch }}
            type=raw,value=${{ steps.tags.outputs.sha }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Docker image pushed:"
          echo "${{ steps.meta.outputs.tags }}"
